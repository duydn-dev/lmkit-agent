services:
  api:
    build:
      context: .
      dockerfile: LmKitOmniApi/Dockerfile
    ports:
      - "5032:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - PostgreSql=Server=postgres;Port=5432;Database=LmKitAgent;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};
      - Database__ApplyMigrations=true
      - VectorStore__BaseUrl=http://qdrant:6334
      - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      - AuthCookies__Secure=${AUTH_COOKIE_SECURE:-false}
      - HttpsRedirection__Enabled=false
      - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379}
      - LMKit__LicenseKey=${LMKIT_LICENSE_KEY:-}
      - LiveKit__ApiKey=${LIVEKIT_API_KEY:-}
      - LiveKit__ApiSecret=${LIVEKIT_API_SECRET:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - DataProtection__KeyPath=/var/lib/lmkit/keys
    depends_on:
      volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: "4.0"
    restart: unless-stopped
    volumes:
      - dataprotectionkeys:/var/lib/lmkit/keys
      - models:/app/Models
      - uploads:/app/Uploads

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=LmKitAgent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  volume-init:
    image: alpine:3.22
    user: root
    command: ["sh", "-c", "chown -R 1654:1654 /keys /models /uploads"]
    volumes:
      - dataprotectionkeys:/keys
      - models:/models
      - uploads:/uploads
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    profiles: ["development"]
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  client:
    build:
      context: LmKitOmniClient
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  dataprotectionkeys:
  models:
  uploads:

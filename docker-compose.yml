# =============================================================================
# THERE ARE EXACTLY TWO COMPOSE FILES IN THIS REPO, AND THREE WAYS TO RUN.
# Never add a third file, an override file, or a second full stack behind a
# profile — every mode below is the same two files plus environment variables.
#
#   THIS FILE (docker-compose.yml) = dev infrastructure only. No api, no client.
#   docker-compose.prod.yml        = the ONE full stack (api + client + infra).
#
# ── Mode 1 — dev infra only (this file) ──────────────────────────────────────
#   API and frontend run directly on the host so they can be debugged:
#     1) docker compose --env-file .env up -d
#     2) Backend:  dotnet run --project LmKitOmniApi      (http://localhost:5032)
#     3) Frontend: cd LmKitOmniClient && npm run dev      (http://localhost:5173)
#
# ── Mode 2 — full containerized stack (prod file) ────────────────────────────
#     docker compose -f docker-compose.prod.yml --env-file .env up -d
#   Nginx (client) on CLIENT_HOST_PORT, API on API_HOST_PORT, plus infra.
#
# ── Mode 3 — isolated fullstack e2e gate (prod file, nothing else) ───────────
#   The SAME docker-compose.prod.yml, made side-by-side-safe purely with env
#   vars: shifted host ports (18080/15032/15432/16333/16334/16379), a bootstrap
#   admin for the browser tests, no GPU request, and a separate Compose project
#   name (-p lmkit-fullstack-e2e) so its containers, network and volumes never
#   collide with a developer's mode-1/mode-2 stack.
#   Do not type that env wall by hand — one script owns it, and CI calls the
#   very same script:
#     ./scripts/e2e-fullstack.sh up | test | down     (Windows: scripts\e2e-fullstack.bat)
# =============================================================================

services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=LmKitAgent
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_HTTP_HOST_PORT:-8888}:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LmKitOmniApi.Tests/LmKitOmniApi.Tests.csproj
      - run: dotnet build LmKitOmniApi/LmKitOmniApi.csproj -c Release --no-restore
      - run: dotnet test LmKitOmniApi.Tests/LmKitOmniApi.Tests.csproj -c Release --no-restore
      - run: dotnet list LmKitOmniApi/LmKitOmniApi.csproj package --vulnerable --include-transitive

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LmKitOmniClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LmKitOmniClient/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-32-bytes
      - run: docker compose build api client
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-32-bytes

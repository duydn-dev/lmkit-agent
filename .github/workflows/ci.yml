name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LMKIT_TEST_REDIS_CONNECTION: localhost:6379
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore LmKitOmniApi.Tests/LmKitOmniApi.Tests.csproj
      - run: dotnet build LmKitOmniApi/LmKitOmniApi.csproj -c Release --no-restore
      - name: Test with code coverage
        run: >-
          dotnet test LmKitOmniApi.Tests/LmKitOmniApi.Tests.csproj
          -c Release --no-restore
          --collect:"XPlat Code Coverage"
          --settings LmKitOmniApi.Tests/coverage.runsettings
          --results-directory TestResults
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error
      - name: Fail on vulnerable NuGet packages
        run: |
          set -euo pipefail
          report="$(dotnet list LmKitOmniApi/LmKitOmniApi.csproj package --vulnerable --include-transitive)"
          echo "$report"
          if printf '%s\n' "$report" | grep -Eq '^[[:space:]]*>|[[:space:]](Critical|High|Moderate|Low)[[:space:]]'; then
            echo "::error::Vulnerable NuGet package(s) detected in LmKitOmniApi. See the report above."
            exit 1
          fi
          echo "No known-vulnerable NuGet packages detected."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LmKitOmniClient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LmKitOmniClient/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-32-bytes
          REDIS_PASSWORD: ci-only-redis-password
      - run: docker compose build api client
        env:
          POSTGRES_PASSWORD: ci-only-password
          JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-32-bytes
          REDIS_PASSWORD: ci-only-redis-password

  fullstack-e2e:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: e2e-postgres-password
      JWT_SECRET_KEY: e2e-jwt-secret-that-is-longer-than-32-bytes
      REDIS_PASSWORD: e2e-redis-password
      E2E_ADMIN_EMAIL: e2e-admin@example.test
      E2E_ADMIN_PASSWORD: E2e-Admin-2026!
      E2E_BASE_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LmKitOmniClient/package-lock.json
      - run: npm ci
        working-directory: LmKitOmniClient
      - run: npx playwright install --with-deps chromium
        working-directory: LmKitOmniClient
      - run: docker compose -p lmkit-fullstack-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait --wait-timeout 180
      - run: npm run test:e2e:fullstack
        working-directory: LmKitOmniClient
      - if: always()
        run: docker compose -p lmkit-fullstack-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v --remove-orphans

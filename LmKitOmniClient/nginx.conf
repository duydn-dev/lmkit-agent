# The embeddable widget document is the ONE route that third-party sites must be
# able to frame. nginx cannot know which sites a tenant allowlisted, so the API
# answers that per widget key (GET /api/widget/frame-policy).
#
# The API itself already returns 'none' for a missing, malformed, unknown,
# revoked or expired key. This map is the layer underneath: if the subrequest
# succeeds but carries no X-Widget-Frame-Ancestors header at all (or an empty
# one), the directive would otherwise be emitted as a malformed, value-less
# `frame-ancestors ;`, so an empty answer becomes an explicit fail-closed
# 'none'. An API that cannot be reached fails the subrequest outright and the
# widget document is not served at all.
map $widget_frame_ancestors $widget_frame_ancestors_or_none {
    ""      "'none'";
    default $widget_frame_ancestors;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Public widget document. Everything else keeps frame-ancestors 'self'; this
    # route takes its frame-ancestors from the tenant's configured origin
    # allowlist, resolved by the API from the ?key= on the iframe URL.
    location = /widget/chat {
        # Capture ?key= HERE, in the parent request. The auth_request subrequest
        # below has an EMPTY query string of its own, but subrequests share the
        # parent's variable array — so this is the only place the key can be
        # picked up for the subrequest to use. $arg_key is empty when ?key= is
        # missing, and the API reads an empty key as "no key" -> 'none'.
        set $widget_key $arg_key;

        auth_request /internal/widget-frame-policy;
        auth_request_set $widget_frame_ancestors $upstream_http_x_widget_frame_ancestors;

        # add_header does NOT inherit once a level declares any of its own, so the
        # server-level security headers are repeated here — with the per-tenant
        # frame-ancestors replacing the app-wide 'self'.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors $widget_frame_ancestors_or_none; base-uri 'self'; form-action 'self'" always;

        try_files /index.html =404;
    }

    # Internal only: the auth_request subrequest that asks the API for this
    # tenant's frame-ancestors. The body is never forwarded.
    #
    # An auth_request subrequest does NOT inherit the parent's query string —
    # nginx creates it with no arguments of its own, so $args and $is_args are
    # ALWAYS EMPTY here regardless of what the browser sent. This location used
    # to end in `$is_args$args` under a comment claiming the opposite; it
    # expanded to nothing on every request, the API saw a keyless call, and so
    # every embedded widget got the fail-closed 'none' and could not be framed
    # by anyone. What subrequests DO share with the parent is the variable
    # array, so we rebuild the query string from the $widget_key that
    # /widget/chat captured.
    #
    # Keep proxy_pass literal. A variable anywhere in a proxy_pass URL switches
    # nginx to resolving the host at request time rather than at config load:
    # "api" would then resolve only while some OTHER location happens to declare
    # it as a server group, and would otherwise need a `resolver` — without one
    # every subrequest 502s and the widget document 500s.
    #
    # $widget_key is attacker-controlled but cannot break out of the query
    # string: nginx never decodes $arg_key, an argument value stops at '&', and
    # the request-line parser rejects raw CR/LF — so the upstream request line
    # is always this fixed path plus exactly one key= argument. Nor can it reach
    # the CSP header, which is built solely from the API's own
    # X-Widget-Frame-Ancestors response header (normalized origins or 'none').
    location = /internal/widget-frame-policy {
        internal;
        set $args "key=$widget_key";
        proxy_pass http://api:5000/api/widget/frame-policy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Chat streaming is Server-Sent Events over this same /api/ prefix — there is no
    # WebSocket/SignalR surface in the API (a dead `location /hubs/` that proxied to a
    # hub the API never registered was removed; `AddSignalR`/`MapHub` appear nowhere).
    #
    # The last two directives are what make SSE work and both are load-bearing:
    #   proxy_buffering off  — otherwise nginx accumulates the response and the client
    #                          receives nothing until the answer is complete, so the
    #                          chat appears to hang and then arrive all at once.
    #   proxy_read_timeout   — a long answer can idle between tokens; the default 60s
    #                          would cut the stream mid-answer.
    # Neither failure surfaces an error to the user. Do not "tidy" them away.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

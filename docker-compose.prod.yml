x-api-environment: &api-env
  - ASPNETCORE_ENVIRONMENT=Production
  - PostgreSql=Server=postgres;Port=5432;Database=LmKitAgent;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};
  - Database__ApplyMigrations=true
  - VectorStore__BaseUrl=http://qdrant:6334
  - WebSearch__Searx__BaseUrl=${SEARXNG_BASE_URL:-http://searxng:8080}
  - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  - AuthCookies__Secure=${AUTH_COOKIE_SECURE:-false}
  - HttpsRedirection__Enabled=false
  - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost}
  - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379},password=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  - LMKit__LicenseKey=${LMKIT_LICENSE_KEY:-}
  - LMKit__RequireLicense=${LMKIT_REQUIRE_LICENSE:-false}
  - AiModels__DefaultChat=${AI_DEFAULT_CHAT:-bonsai}
  - AiModels__DefaultVision=${AI_DEFAULT_VISION:-glm-ocr}
  - AiModels__DefaultEmbedding=${AI_DEFAULT_EMBEDDING:-bge-m3}
  - AiModels__DefaultReranker=${AI_DEFAULT_RERANKER:-bge-m3}
  - AiModels__WarmupChatModel=${AI_WARMUP_CHAT_MODEL:-false}
  - AiModels__RequireChatModelReady=${AI_REQUIRE_CHAT_MODEL_READY:-false}
  - BootstrapAdmin__Enabled=${BOOTSTRAP_ADMIN_ENABLED:-false}
  - BootstrapAdmin__Email=${BOOTSTRAP_ADMIN_EMAIL:-}
  - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:-}
  - LiveKit__ApiKey=${LIVEKIT_API_KEY:-}
  - LiveKit__ApiSecret=${LIVEKIT_API_SECRET:-}
  - Voice__LiveAgentEnabled=${VOICE_LIVE_AGENT_ENABLED:-false}
  - Voice__LiveKitUrl=${LIVEKIT_URL:-ws://livekit:7880}
  - Voice__LiveKitApiKey=${LIVEKIT_API_KEY:-}
  - Voice__LiveKitApiSecret=${LIVEKIT_API_SECRET:-}
  - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  - DataProtection__KeyPath=/var/lib/lmkit/keys

x-api-depends_on: &api-deps
  volume-init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  redis:
    condition: service_healthy

x-api-volumes: &api-volumes
  - dataprotectionkeys:/var/lib/lmkit/keys
  - ${AI_MODELS_HOST_DIR:-./LmKitOmniApi/AIModels}:/app/AIModels:ro
  - ${AI_MODELS_CACHE_HOST_DIR:-models}:/app/Models
  - uploads:/app/Uploads

x-api-resources: &api-resources
  limits:
    memory: 12G
    cpus: "4.0"
  # GPU passthrough. This used to be the short form `gpus: all`, which CANNOT be
  # switched off by an environment variable — the schema accepts the literal
  # "all" and nothing else — so any host without a working NVIDIA GPU +
  # nvidia-container-toolkit could not start the API at all (the daemon fails
  # the container with "could not select device driver ... [[gpu]]", or with
  # nvidia-container-cli init errors). That includes GPU-less CI runners and the
  # CPU-only deployments LmKitOmniApi/Dockerfile explicitly supports.
  # The long form takes a count, so ONE file covers both without an override:
  #   API_GPU_COUNT unset / "all" -> every GPU (unchanged default behavior)
  #   API_GPU_COUNT=0             -> no GPU requested; LM-Kit falls back to CPU
  reservations:
    devices:
      - driver: nvidia
        count: ${API_GPU_COUNT:-all}
        capabilities: [gpu]

services:
  api:
    image: ${API_IMAGE:-duydndev/lmkit-api}:${API_IMAGE_TAG:-latest}
    ports:
      - "${API_HOST_PORT:-5032}:5000"
    environment: *api-env
    depends_on: *api-deps
    deploy:
      resources: *api-resources
    # Liveness only, on purpose — and this OVERRIDES the image's own HEALTHCHECK
    # (which curls /health). /health and /health/ready both run the "lmkit-model"
    # check, which reports Unhealthy whenever AiModels:DefaultChat names a
    # registered model whose weights file is not on disk. That is the normal
    # state of a CI runner or a fresh checkout (LmKitOmniApi/AIModels/ is not in
    # the repo), so waiting on them would leave `up --wait` hanging until timeout.
    # /health/live is mapped with Predicate = _ => false: it runs no checks, so a
    # 200 means only "Kestrel is accepting requests" — which in this app happens
    # strictly AFTER EF migrations and the BootstrapAdmin seed, because both run
    # before app.Run(). Backing-service readiness is already guaranteed by
    # depends_on: service_healthy above, so the pair is a real readiness gate.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    volumes: *api-volumes

  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=LmKitAgent
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot: the API runs as uid 1654 and must own its writable mounts.
  # `up --wait` handles this correctly (it is satisfied by the exit-0 because
  # `api` waits on it with service_completed_successfully). It only reports a
  # failure if you start it WITHOUT that dependent — e.g.
  # `up -d --wait volume-init postgres`; start the whole stack instead.
  volume-init:
    image: alpine:3.23
    user: root
    command: ["sh", "-c", "chown -R 1654:1654 /keys /models /uploads"]
    volumes:
      - dataprotectionkeys:/keys
      # Must be the SAME source expression the api service mounts at /app/Models,
      # or setting AI_MODELS_CACHE_HOST_DIR chowns the unused named volume and
      # leaves the host directory the API actually writes to owned by root.
      - ${AI_MODELS_CACHE_HOST_DIR:-models}:/models
      - uploads:/uploads
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    profiles: ["development", "production"]
    command: --config /etc/livekit.yaml
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE:-duydndev/lmkit-client}:${CLIENT_IMAGE_TAG:-latest}
    ports:
      - "${CLIENT_HOST_PORT:-80}:80"
    depends_on:
      - api
    # Without this, `up --wait` only waits for the container to be RUNNING, and
    # nginx is "running" a moment before it serves anything — so the browser
    # gate could fire its first request into a closed port. nginx:alpine has no
    # curl; busybox wget is present (same probe the searxng service uses).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  dataprotectionkeys:
  models:
  uploads:

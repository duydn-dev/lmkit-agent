x-api-environment: &api-env
  - ASPNETCORE_ENVIRONMENT=Production
  - PostgreSql=Server=postgres;Port=5432;Database=LmKitAgent;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD};
  - Database__ApplyMigrations=true
  - VectorStore__BaseUrl=http://qdrant:6334
  - WebSearch__Searx__BaseUrl=${SEARXNG_BASE_URL:-http://searxng:8080}
  - JwtSettings__SecretKey=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
  - AuthCookies__Secure=${AUTH_COOKIE_SECURE:-false}
  - HttpsRedirection__Enabled=false
  - Cors__AllowedOrigins__0=${CORS_ORIGIN:-http://localhost}
  - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING:-redis:6379},password=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
  - LMKit__LicenseKey=${LMKIT_LICENSE_KEY:-}
  - LMKit__RequireLicense=${LMKIT_REQUIRE_LICENSE:-false}
  - AiModels__DefaultChat=${AI_DEFAULT_CHAT:-bonsai}
  - AiModels__DefaultVision=${AI_DEFAULT_VISION:-glm-ocr}
  - AiModels__DefaultEmbedding=${AI_DEFAULT_EMBEDDING:-bge-m3}
  - AiModels__DefaultReranker=${AI_DEFAULT_RERANKER:-bge-m3}
  - AiModels__WarmupChatModel=${AI_WARMUP_CHAT_MODEL:-false}
  - AiModels__RequireChatModelReady=${AI_REQUIRE_CHAT_MODEL_READY:-false}
  - BootstrapAdmin__Enabled=${BOOTSTRAP_ADMIN_ENABLED:-false}
  - BootstrapAdmin__Email=${BOOTSTRAP_ADMIN_EMAIL:-}
  - BootstrapAdmin__Password=${BOOTSTRAP_ADMIN_PASSWORD:-}
  - LiveKit__ApiKey=${LIVEKIT_API_KEY:-}
  - LiveKit__ApiSecret=${LIVEKIT_API_SECRET:-}
  - Voice__LiveAgentEnabled=${VOICE_LIVE_AGENT_ENABLED:-false}
  - Voice__LiveKitUrl=${LIVEKIT_URL:-ws://livekit:7880}
  - Voice__LiveKitApiKey=${LIVEKIT_API_KEY:-}
  - Voice__LiveKitApiSecret=${LIVEKIT_API_SECRET:-}
  - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  - DataProtection__KeyPath=/var/lib/lmkit/keys

x-api-depends_on: &api-deps
  volume-init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  qdrant:
    condition: service_healthy
  redis:
    condition: service_healthy

x-api-volumes: &api-volumes
  - dataprotectionkeys:/var/lib/lmkit/keys
  - ${AI_MODELS_HOST_DIR:-./LmKitOmniApi/AIModels}:/app/AIModels:ro
  - ${AI_MODELS_CACHE_HOST_DIR:-models}:/app/Models
  - uploads:/app/Uploads

x-api-resources: &api-resources
  limits:
    memory: 12G
    cpus: "4.0"

services:
  api:
    image: ${API_IMAGE:-duydndev/lmkit-api}:${API_IMAGE_TAG:-latest}
    ports:
      - "${API_HOST_PORT:-5032}:5000"
    environment: *api-env
    depends_on: *api-deps
    deploy:
      resources: *api-resources
    gpus: all
    restart: unless-stopped
    volumes: *api-volumes

  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=LmKitAgent
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  volume-init:
    image: alpine:3.23
    user: root
    command: ["sh", "-c", "chown -R 1654:1654 /keys /models /uploads"]
    volumes:
      - dataprotectionkeys:/keys
      - models:/models
      - uploads:/uploads
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${QDRANT_HTTP_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    profiles: ["development", "production"]
    command: --config /etc/livekit.yaml
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    restart: unless-stopped

  client:
    image: ${CLIENT_IMAGE:-duydndev/lmkit-client}:${CLIENT_IMAGE_TAG:-latest}
    ports:
      - "${CLIENT_HOST_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  qdrantdata:
  dataprotectionkeys:
  models:
  uploads:
